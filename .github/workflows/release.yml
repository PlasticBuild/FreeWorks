# Builds the release zip from the committed source whenever a version tag is pushed.
# The zip is exactly `git archive` of the tag, with one top folder FreeWorks/, so it always matches the repository.
name: Release zip

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag and the tree
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' package.xml | head -1)
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "package.xml version ${VERSION} does not match tag ${TAG}"; exit 1
          fi
          test -f InitGui.py
          BAD=$(git ls-files | grep -E 'NOT-FOR-DISTRIBUTION|\.lck$|(^|/)\.~\$|\.(exe|dll|so|AppImage|sldprt|sldasm|slddrw)$|__pycache__|\.pyc$' || true)
          if [ -n "$BAD" ]; then echo "Files that must not ship:"; echo "$BAD"; exit 1; fi

      - name: Build the zip
        run: |
          ZIP="FreeWorks-${GITHUB_REF_NAME#v}.zip"
          git archive --format=zip --prefix=FreeWorks/ -o "$ZIP" "${GITHUB_REF_NAME}"
          sha256sum "$ZIP" > "$ZIP.sha256"
          unzip -l "$ZIP" | tail -1

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="FreeWorks-${GITHUB_REF_NAME#v}.zip"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$ZIP" "$ZIP.sha256" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "$ZIP" "$ZIP.sha256" --verify-tag --prerelease \
              --title "FreeWorks ${GITHUB_REF_NAME#v}" --generate-notes
          fi
